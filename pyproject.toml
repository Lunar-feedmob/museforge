[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "museforge"
version = "0.1.0"
description = "Distill great image-generation knowledge into better visual prompts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MuseForge contributors" }]
keywords = [
    "image-generation",
    "prompt-engineering",
    "creative-direction",
    "knowledge-base",
    "ai-image",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
museforge = "museforge.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/museforge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["museforge"]
mypy_path = "src"
exclude = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
